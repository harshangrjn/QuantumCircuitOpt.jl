name: Documentation

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
          key: ${{ runner.os }}-${{ runner.arch }}-docs-${{ hashFiles('Project.toml', 'docs/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-docs-
      - name: Install Dependencies
        run: julia --project=docs -e 'using Pkg; VERSION < v"1.11" && Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build and Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --color=yes --project=docs docs/make.jl

# Documenter deploys only trusted push and tag builds; pull requests are build-only.