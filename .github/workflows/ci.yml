name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v6
        env:
          cache-name: julia
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ env.cache-name }}-${{ hashFiles('Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          depwarn: error
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
      - if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        uses: julia-actions/julia-processcoverage@v1
      - if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: lcov.info
          fail_ci_if_error: true
          name: QuantumCircuitOpt
          use_oidc: true

# Coverage is uploaded only by the latest Julia job on Linux.